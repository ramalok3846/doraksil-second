<style>
:root{
  --bg:#f3eeff;--bg2:#e9e0ff;--card:#fff;--p:#b9a4f0;--p2:#8f73e0;--p3:#6b4fc4;--ink:#2a2050;--mute:#7b7399;
  --line:#d9ccf7;--ok:#2e9e6b;--bad:#d1456b;--warn:#e0a526;
  --sh:0 4px 0 var(--p2);--r:18px;
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  background:
   radial-gradient(circle at 15% 10%,#fff8 0,#fff0 40%),
   repeating-linear-gradient(0deg,#0000 0 23px,#b9a4f01f 23px 24px),
   repeating-linear-gradient(90deg,#0000 0 23px,#b9a4f01f 23px 24px),var(--bg);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--p3)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--p);border-bottom:4px solid var(--p2);position:sticky;top:0;z-index:20}
.top b{font-size:18px;letter-spacing:.5px}
.top .sp{flex:1}
.pill{font-size:12px;font-weight:800;padding:4px 9px;border-radius:99px;background:#fff;border:2px solid var(--p2);white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:5px;vertical-align:1px}
.dot.off{background:var(--bad)}.dot.syn{background:var(--warn)}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:16px 14px 28px}
.card{background:var(--card);border:3px solid var(--p2);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin:0 0 16px}
.card h2,.card h3{margin:0 0 10px}
.btn{appearance:none;border:3px solid var(--p3);background:var(--p2);color:#fff;font-weight:900;padding:12px 18px;border-radius:14px;box-shadow:0 4px 0 var(--p3);cursor:pointer;font-size:16px;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--p3)}
.btn.ghost{background:#fff;color:var(--p3)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:11px;box-shadow:0 3px 0 var(--p3)}
.btn.red{background:var(--bad);border-color:#9d2a4b;box-shadow:0 4px 0 #9d2a4b}
.btn.big{font-size:26px;padding:22px 30px;width:100%;border-radius:20px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-weight:800;font-size:14px;margin:0 0 12px}
label.f small{font-weight:600;color:var(--mute)}

.in:focus{outline:none;border-color:var(--p2)}
textarea.in{min-height:80px;resize:vertical}
.muted{color:var(--mute);font-size:13px}
.hero{text-align:center;padding:26px 14px}
.marquee{display:inline-block;font-weight:900;font-size:clamp(34px,10vw,64px);letter-spacing:2px;color:var(--p3);text-shadow:3px 3px 0 #fff,6px 6px 0 var(--p)}
.blink{animation:bl 1.1s steps(2,start) infinite}
@keyframes bl{to{visibility:hidden}}
.tag{display:inline-block;background:var(--bg2);border:2px solid var(--p);border-radius:10px;padding:3px 10px;font-weight:800;font-size:13px;margin:3px}
.books{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.bk{width:150px;text-align:center}
.bk .cv{width:150px;height:205px;border:3px solid var(--p2);border-radius:10px;background:var(--bg2) center/cover no-repeat;display:grid;place-items:center;font-size:40px;box-shadow:var(--sh)}
.bk b{display:block;margin-top:8px;font-size:14px}
.cab{border:5px solid var(--p3);border-radius:24px;background:linear-gradient(#fff,#f6f1ff);padding:14px;text-align:center;box-shadow:0 6px 0 var(--p2)}
.screen{background:#2a2050;color:#e9e0ff;border:4px solid var(--p3);border-radius:14px;padding:14px 8px;margin:12px 0}
.digits{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-weight:900;font-size:clamp(40px,14vw,92px);letter-spacing:1px;font-variant-numeric:tabular-nums;color:#d8c8ff}
.digits.run{color:#fff}
.target{font-size:clamp(28px,9vw,54px);font-weight:900;color:var(--p3)}
.step{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.step i{width:34px;height:10px;border-radius:5px;background:var(--line);border:2px solid var(--p2)}
.step i.on{background:var(--p2)}.step i.done{background:var(--ok);border-color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:2px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--bg2);position:sticky;top:0}
.tw{overflow:auto;max-height:60vh;border:2px solid var(--line);border-radius:12px}
.rk1{background:#fff3c4}.rk2{background:#eef0f6}.rk3{background:#f6e3d3}
.medal{font-weight:900}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:3px solid var(--p2);background:#fff;color:var(--p3);font-weight:900;border-radius:12px;padding:8px 12px;cursor:pointer}
.tabs button.on{background:var(--p2);color:#fff}
.savebar{position:sticky;bottom:0;z-index:15;background:#fffe;backdrop-filter:blur(6px);border:3px solid var(--p2);border-radius:14px;padding:10px;margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;z-index:99;max-width:92vw;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px #0005}
.modal{position:fixed;inset:0;background:#2a205088;z-index:90;display:grid;place-items:center;padding:14px}
.modal .card{max-width:520px;width:100%;max-height:90vh;overflow:auto;margin:0}
canvas.sig{width:100%;height:150px;border:3px dashed var(--p2);border-radius:12px;background:#fff;touch-action:none;display:block}
.bedit{display:grid;grid-template-columns:110px 1fr;gap:12px}
@media(max-width:560px){.bedit{grid-template-columns:1fr}}
.cvedit{width:110px;height:150px;border:3px solid var(--p2);border-radius:10px;background:var(--bg2) center/cover no-repeat;display:grid;place-items:center;cursor:pointer;font-size:12px;font-weight:800;text-align:center;color:var(--p3)}
.big-num{font-size:clamp(40px,12vw,76px);font-weight:900;color:var(--p3)}
.win{color:var(--ok)}.lose{color:var(--bad)}
.foot{text-align:center;padding:10px 14px 18px;color:var(--mute);font-size:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.seg label{border:3px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:800;cursor:pointer;font-size:13px}
.seg input{display:none}.seg input:checked+span{color:#fff}
.seg label:has(input:checked){background:var(--p2);border-color:var(--p3);color:#fff}
code.k{background:var(--bg2);padding:2px 6px;border-radius:6px;font-size:13px;word-break:break-all}
.hide{display:none!important}
@media print{.top,.foot,.savebar,.tabs{display:none}}
</style>

<body>
<div class="top" id="top"></div>
<main id="app"><div class="card hero"><div class="marquee">도락실</div><p class="muted">불러오는 중…</p></div></main>
<div class="foot" id="foot"></div>
<div id="layer"></div>

<script>
'use strict';
/* =====================================================================
   도락실 · 초 맞추기  (도서부 오락실)
   폴란드 퀴즈와 같은 원리: 폴더 하나 + 상대경로 + 단일 앱 + 주소 파라미터(?admin 등)
   · 로컬 우선: 모든 기록은 먼저 이 기기에 저장 → 인터넷이 되면 클라우드(Firebase REST)로 전송(대기열)
   · 오프라인: 서비스 워커가 앱 전체를 저장, 주소 입력/새로고침/앱 아이콘 모두 동작
   · 관리자: Firebase 이메일 로그인(REST) + 데이터베이스 admins/{uid}=true 인 계정만
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={
  get(k,d){try{const v=localStorage.getItem('dr_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('dr_'+k,JSON.stringify(v));return true}catch(e){return false}},
  del(k){try{localStorage.removeItem('dr_'+k)}catch(e){}}
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const BUILD=(document.querySelector('meta[name="pq-build"]')||{}).content||'';
const VER=(document.querySelector('meta[name="pq-ver"]')||{}).content||'';
const BDATE=(document.querySelector('meta[name="pq-date"]')||{}).content||'';

/* ---------- 기본 설정 ---------- */
const DEF={
  ev:{title:'도락실',sub:'도서부 오락실 · 초 맞추기',date:'2026년 11월 11일 (수)',place:'충무공초등학교 꿈마루 도서관',
      welcome:'도서부 오락실 "도락실"에 오신 것을 환영해요!\n책 청구기호를 보고, 스톱워치를 목표 시간에 가장 가깝게 멈춰 보세요.\n예) 청구기호 201 → 2.01초'},
  books:[
    {id:'b1',title:'도서부 추천도서 1',author:'',call:'201',cover:''},
    {id:'b2',title:'도서부 추천도서 2',author:'',call:'305',cover:''}
  ],
  fields:{name:'req',grade:'req',klass:'req',num:'opt',sign:'opt'},
  opts:{hideAfter:0,boardName:'masked',showBoardOnResult:true,autoReset:0},
  ts:0
};
const FB={url:'https://pal-inte-db-default-rtdb.asia-southeast1.firebasedatabase.app',apiKey:'AIzaSyCEmf0KIiaF11nmS2CfBNA5yxZA9nrtmUU',root:'dr'};
let CFG=loadCfg();
function loadCfg(){
  const s=store.get('cfg',null);const c=JSON.parse(JSON.stringify(DEF));
  if(s){for(const k of ['ev','fields','opts'])Object.assign(c[k],s[k]||{});if(Array.isArray(s.books)&&s.books.length)c.books=s.books;c.ts=s.ts||0}
  return c;
}
function saveCfgLocal(c){CFG=c;store.set('cfg',c)}

/* ---------- 계산 ---------- */
/* 청구기호의 첫 숫자 덩어리 ÷ 100 = 목표(초).  201 → 2.01초,  813 → 8.13초 */
const targetMs=b=>{const m=/\d+/.exec(String((b&&b.call)||''));return m?parseInt(m[0],10)*10:0};
const pad=(n,l)=>String(n).padStart(l,'0');
const fmt=ms=>{ms=Math.max(0,Math.round(ms));return pad(Math.floor(ms/60000),2)+':'+pad(Math.floor(ms/1000)%60,2)+'.'+pad(ms%1000,3)};
const sec=ms=>(ms/1000).toFixed(3)+'초';
const noStr=n=>'D-'+pad(n,3);
const maskName=n=>{n=String(n||'').trim();if(n.length<=1)return n;if(n.length===2)return n[0]+'*';return n[0]+'*'.repeat(n.length-2)+n[n.length-1]};

/* ---------- 네트워크 / 클라우드(REST) ---------- */
const net={online:navigator.onLine,state:'idle'};
async function fetchT(url,opt,ms){
  const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||8000);
  try{return await fetch(url,Object.assign({},opt,{signal:c.signal}))}finally{clearTimeout(t)}
}
const Auth={
  id:null,
  load(){let v=null;try{v=sessionStorage.getItem('dr_adm')||localStorage.getItem('dr_adm')}catch(e){}try{Auth.id=v?JSON.parse(v):null}catch(e){Auth.id=null}},
  keep(){try{return localStorage.getItem('dr_keep')==='1'}catch(e){return false}},
  save(){const t=JSON.stringify(Auth.id),k=Auth.keep();try{sessionStorage.removeItem('dr_adm');localStorage.removeItem('dr_adm')}catch(e){}try{(k?localStorage:sessionStorage).setItem('dr_adm',t)}catch(e){}},
  clear(){Auth.id=null;try{sessionStorage.removeItem('dr_adm');localStorage.removeItem('dr_adm')}catch(e){}},
  async post(url,body,form){
    let r;
    try{r=await fetchT(url,{method:'POST',headers:{'Content-Type':form?'application/x-www-form-urlencoded':'application/json'},body:form?new URLSearchParams(body).toString():JSON.stringify(body)},9000)}
    catch(e){const x=new Error('network');x.kind='net';throw x}
    const j=await r.json().catch(()=>({}));
    if(!r.ok){const x=new Error((j.error&&j.error.message)||('HTTP '+r.status));x.kind=r.status>=500?'net':'auth';throw x}
    return j;
  },
  async signIn(email,pw){
    const j=await Auth.post('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(FB.apiKey),{email,password:pw,returnSecureToken:true});
    Auth.id={idToken:j.idToken,refresh:j.refreshToken,exp:Date.now()+(+j.expiresIn||3600)*1000,uid:j.localId,email:j.email||email,admin:null};
    Auth.save();return Auth.id;
  },
  async refresh(){
    const a=Auth.id;
    const j=await Auth.post('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(FB.apiKey),{grant_type:'refresh_token',refresh_token:a.refresh},true);
    Auth.id=Object.assign({},a,{idToken:j.id_token,refresh:j.refresh_token,exp:Date.now()+(+j.expires_in||3600)*1000,uid:j.user_id});
    Auth.save();return Auth.id;
  },
  async token(){
    const a=Auth.id;if(!a)return null;
    if(a.exp-Date.now()>60000)return a.idToken;
    try{return (await Auth.refresh()).idToken}catch(e){return null}
  }
};
const Cloud={
  async req(path,method,body,adm,ms){
    let q='';
    if(adm){const t=await Auth.token();if(!t){const x=new Error('noauth');x.kind='auth';throw x}q='?auth='+encodeURIComponent(t)}
    let r;
    try{r=await fetchT(FB.url+'/'+(path[0]==='/'?path.slice(1):FB.root+'/'+path)+'.json'+q,{method,headers:body!==undefined?{'Content-Type':'application/json'}:undefined,body:body!==undefined?JSON.stringify(body):undefined},ms||8000)}
    catch(e){const x=new Error('network');x.kind='net';throw x}
    if(r.status===401||r.status===403){const x=new Error('denied');x.kind='auth';throw x}
    if(!r.ok){const x=new Error('HTTP '+r.status);x.kind=r.status>=500?'net':'bad';throw x}
    return r.json().catch(()=>null);
  },
  get:(p,adm,ms)=>Cloud.req(p,'GET',undefined,adm,ms),
  put:(p,b,adm)=>Cloud.req(p,'PUT',b,adm),
  del:(p,adm)=>Cloud.req(p,'DELETE',undefined,adm)
};
/* 오프라인 대기열: 같은 요청을 여러 번 보내도 안전하도록 PUT/DELETE 만 사용 */
const Q={
  list(){return store.get('q',[])},
  push(job){job.id=uid();const l=Q.list();l.push(job);store.set('q',l);Q.flush()},
  busy:false,
  async flush(){
    if(Q.busy||!navigator.onLine)return;Q.busy=true;setNet('syn');
    const done=new Set();
    try{
      for(const j of Q.list()){
        try{if(j.m==='DELETE')await Cloud.del(j.p,!!j.adm);else await Cloud.put(j.p,j.b,!!j.adm);done.add(j.id)}
        catch(e){if(e.kind==='bad'){done.add(j.id);continue}if(e.kind==='net')break}
      }
    }catch(e){}
    store.set('q',Q.list().filter(j=>!done.has(j.id)));
    Q.busy=false;setNet(Q.list().length?'wait':'ok');
  }
};
function setNet(s){net.state=s;renderTop()}

/* ---------- 기록 ---------- */
const Recs={
  local(){return store.get('recs',[])},
  addLocal(r){const l=Recs.local();l.push(r);store.set('recs',l)},
  delLocal(id){store.set('recs',Recs.local().filter(r=>r.id!==id))},
  /* 참여 번호: 클라우드 카운터(오르기만 가능) → 실패 시 이 기기 번호 */
  async nextNo(){
    let base=store.get('cnt',0);
    for(let k=0;k<3;k++){
      try{
        const c=await Cloud.get('cnt',false,2500);const cur=Math.max(base,+c||0);
        await Cloud.put('cnt',cur+1,false);store.set('cnt',cur+1);return {n:cur+1,off:0};
      }catch(e){if(e.kind==='net')break}
    }
    const n=base+1;store.set('cnt',n);return {n,off:1};
  },
  async submit(p,res){
    const total=res.reduce((a,x)=>a+x.diff,0);
    const rec={id:uid(),ts:Date.now(),p,res,total,first:res[0]?res[0].diff:0,dev:devId()};
    const {n,off}=await Recs.nextNo();rec.n=n;rec.off=off;
    Recs.addLocal(rec);
    const nm=CFG.opts.boardName==='none'?'':(CFG.opts.boardName==='full'?p.name:maskName(p.name));
    const gk=[p.grade&&p.grade+'학년',p.klass&&p.klass+'반'].filter(Boolean).join(' ');
    Q.push({m:'PUT',p:'records/'+rec.id,b:{json:JSON.stringify(rec),ts:rec.ts}});
    Q.push({m:'PUT',p:'board/'+rec.id,b:{n:rec.n,nm:nm||'',g:gk,t:rec.total,f:rec.first,ts:rec.ts}});
    return rec;
  },
  /* 관리자: 클라우드 + 이 기기 합치기 */
  async all(){
    const map=new Map();Recs.local().forEach(r=>map.set(r.id,r));let cloudOk=false;
    try{
      const o=await Cloud.get('records',true,10000)||{};cloudOk=true;
      for(const [id,v] of Object.entries(o)){try{const r=JSON.parse(v.json);r.id=r.id||id;map.set(r.id,r)}catch(e){}}
    }catch(e){}
    const l=[...map.values()];l.sort((a,b)=>a.total-b.total||a.first-b.first||a.ts-b.ts);
    return {list:l,cloudOk};
  },
  /* 공개 순위판: board(공개 읽기) + 이 기기 */
  async board(){
    const map=new Map();
    Recs.local().forEach(r=>map.set(r.id,{id:r.id,n:r.n,nm:CFG.opts.boardName==='none'?'':(CFG.opts.boardName==='full'?r.p.name:maskName(r.p.name)),g:[r.p.grade&&r.p.grade+'학년',r.p.klass&&r.p.klass+'반'].filter(Boolean).join(' '),t:r.total,f:r.first,ts:r.ts}));
    let ok=false;
    try{const o=await Cloud.get('board',false,6000)||{};ok=true;for(const [id,v] of Object.entries(o))map.set(id,Object.assign({id},v));store.set('boardCache',Object.entries(o).map(([id,v])=>Object.assign({id},v)))}
    catch(e){store.get('boardCache',[]).forEach(v=>{if(!map.has(v.id))map.set(v.id,v)})}
    const l=[...map.values()];l.sort((a,b)=>a.t-b.t||(a.f||0)-(b.f||0)||a.ts-b.ts);return {list:l,ok};
  }
};
const devId=()=>{let d=store.get('dev',null);if(!d){d=uid();store.set('dev',d)}return d};

/* ---------- 화면 공통 ---------- */
const P=new URLSearchParams(location.search);
const base=location.pathname.replace(/[^\/]*$/,'');
function go(q){history.pushState(null,'',base+(q?'?'+q:''));route()}
function toast(msg,btn,fn,ms){
  const old=$('#toast');if(old)old.remove();
  const d=document.createElement('div');d.className='toast';d.id='toast';d.innerHTML='<span>'+esc(msg)+'</span>'+(btn?'<button class="btn sm">'+esc(btn)+'</button>':'');
  if(btn)$('button',d).onclick=()=>{d.remove();fn&&fn()};
  document.body.appendChild(d);setTimeout(()=>d.remove(),ms||(btn?12000:2800));
}

function Sig(cv){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=cv.clientWidth||300,h=150;cv.width=w*dpr;cv.height=h*dpr;
  const c=cv.getContext('2d');c.scale(dpr,dpr);c.lineWidth=3;c.lineCap='round';c.lineJoin='round';c.strokeStyle='#2a2050';
  let down=false,dirty=false;
  const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);const [x,y]=pt(e);c.beginPath();c.moveTo(x,y);c.lineTo(x+.1,y+.1);c.stroke();dirty=true};
  cv.onpointermove=e=>{if(!down)return;const [x,y]=pt(e);c.lineTo(x,y);c.stroke()};
  cv.onpointerup=cv.onpointercancel=()=>{down=false};
  return {clear(){c.clearRect(0,0,w,h);dirty=false},
    data(){if(!dirty)return '';const t=document.createElement('canvas');t.width=300;t.height=100;const x=t.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,300,100);x.drawImage(cv,0,0,300,100);return t.toDataURL('image/jpeg',.6)}};
}

function shrink(file,max){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.78))};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u;
  });
}

/* =====================================================================
   업데이트 / 서비스 워커 / 복구
   ===================================================================== */
const Updater={
  async remote(){try{const r=await fetchT('version.json?_='+Date.now(),{cache:'no-store'},6000);return r.ok?await r.json():null}catch(e){return null}},
  /* 설정만 업데이트: 클라우드 cfg 를 받아 이 기기에 저장 */
  async settings(force){
    if(!navigator.onLine)return {ok:false,msg:'오프라인이에요. 이 기기에 저장된 설정을 쓰고 있어요.'};
    try{
      const c=await Cloud.get('cfg',false,7000);
      if(!c||!Array.isArray(c.books))return {ok:true,msg:'클라우드에 저장된 설정이 아직 없어요.'};
      if(!force&&(c.ts||0)<=(CFG.ts||0))return {ok:true,msg:'이미 최신 설정이에요.'};
      const n=JSON.parse(JSON.stringify(DEF));for(const k of ['ev','fields','opts'])Object.assign(n[k],c[k]||{});n.books=c.books;n.ts=c.ts||Date.now();
      const changed=(c.ts||0)!==(CFG.ts||0);saveCfgLocal(n);DRAFT=null;
      return {ok:true,changed,msg:changed?'새 설정을 받았어요.':'이미 최신 설정이에요.'};
    }catch(e){return {ok:false,msg:e.kind==='net'?'네트워크 오류로 설정을 못 받았어요.':'설정을 받을 수 없어요. (규칙 게시 확인)'}}
  },
  async app(hard,out){
    const say=t=>{if(out)out.textContent=t};
    if(!navigator.onLine){say('오프라인이에요. 인터넷에 연결한 뒤 다시 눌러 주세요.');return 'off'}
    say('서버 확인 중…');const v=await Updater.remote();
    if(!v){say('서버에 연결할 수 없어요.');return 'fail'}
    const newer=v.build&&v.build!==BUILD;
    if(!newer&&!hard){say('이미 최신 버전이에요. ('+VER+')');return 'same'}
    say(hard?'캐시를 지우고 새로 받는 중…':'새 버전을 받는 중…');
    try{
      if(hard){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}
      else{const r=await navigator.serviceWorker.getRegistration();if(r)await r.update()}
    }catch(e){}
    say('완료! 새로 시작해요…');await sleep(500);location.replace(base+'?_u='+Date.now().toString(36));return 'done';
  },
  async diag(){
    const out=[];out.push('온라인: '+(navigator.onLine?'예':'아니오'));
    out.push('서비스 워커: '+('serviceWorker' in navigator?((await navigator.serviceWorker.getRegistration())?'등록됨':'등록 안 됨'):'지원 안 함'));
    try{const ks=await caches.keys();for(const k of ks){const c=await caches.open(k);const rep=await c.match('__report.json');const n=(await c.keys()).length;let t='';if(rep){const j=await rep.json();t=' · 성공 '+j.ok.length+' / 실패 '+j.fail.length+(j.fail.length?' ('+j.fail.map(f=>esc(f[0])).join(', ')+')':'')}out.push('캐시 '+esc(k)+': '+n+'개'+t)}if(!ks.length)out.push('캐시: 없음 (한 번 온라인으로 열어야 해요)')}catch(e){out.push('캐시 확인 실패')}
    try{const e=await navigator.storage.estimate();out.push('저장소: '+(e.usage/1048576).toFixed(1)+'MB / '+(e.quota/1048576|0)+'MB')}catch(e){}
    out.push('이 기기 기록: '+Recs.local().length+'건 · 전송 대기 '+Q.list().length+'건');
    return out.join('<br>');
  }
};

  app().innerHTML='<div class="card hero"><div class="marquee" style="font-size:36px">UPDATE</div><p id="um" style="font-weight:800">준비 중…</p><div class="row" style="justify-content:center"><button class="btn ghost" id="h">처음으로</button></div></div>';
  $('#h').onclick=()=>go('');const m=$('#um');
  if(kind==='settings'){m.textContent='설정 확인 중…';const r=await Updater.settings(P.get('force')==='1');m.textContent=r.msg;if(r.ok){await sleep(1200);go('')}}
  else{const r=await Updater.app(hard,m);if(r==='same'){await sleep(1200);go('')}}
}
async function viewRepair(){
  app().innerHTML='<div class="card"><h2>저장소 진단·복구</h2><div id="dg" class="muted">진단 중…</div><div class="row" style="margin-top:12px"><button class="btn" id="rp">강제 복구 (캐시 삭제 후 새로 설치)</button><button class="btn ghost" id="h">처음으로</button></div><p class="muted">기록과 설정은 지우지 않아요. 앱 파일 캐시만 새로 받아요.</p></div>';
  $('#h').onclick=()=>go('');$('#dg').innerHTML=await Updater.diag();
  $('#rp').onclick=()=>Updater.app(true,$('#dg'));
}
function viewReset(){
  const items=[['recs','이 기기의 참여 기록 (클라우드는 그대로)'],['cfg','이 기기의 설정 (책·화면 옵션)'],['q','전송 대기 목록'],['auth','관리자 로그인 정보'],['cache','앱 캐시 (오프라인 저장본)']];
  const pre=(P.get('reset')||'');const sel=pre==='all'?items.map(i=>i[0]):pre.split(',').map(n=>items[(+n)-1]&&items[(+n)-1][0]).filter(Boolean);
  app().innerHTML='<div class="card"><h2>초기화</h2><p class="muted">지울 항목을 고르세요. 클라우드 데이터는 지워지지 않아요.</p>'+items.map((it,i)=>'<label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" value="'+it[0]+'"'+(sel.includes(it[0])?' checked':'')+'> '+(i+1)+'. '+esc(it[1])+'</label>').join('')+
    '<div class="row"><button class="btn red" id="go">선택 항목 초기화</button><button class="btn ghost" id="h">취소</button></div></div>';
  $('#h').onclick=()=>go('');
  $('#go').onclick=()=>{const c=$$('input:checked').map(x=>x.value);if(!c.length){toast('항목을 골라 주세요');return}
    confirmBox('선택한 항목을 지워요. 되돌릴 수 없어요.\n'+c.join(', '),'초기화',async()=>{
      if(c.includes('recs'))store.del('recs'),store.del('cnt'),store.del('boardCache');
      if(c.includes('cfg'))store.del('cfg');if(c.includes('q'))store.del('q');
      if(c.includes('auth'))Auth.clear();
      if(c.includes('cache')){try{(await caches.keys()).forEach(k=>caches.delete(k));(await navigator.serviceWorker.getRegistrations()).forEach(r=>r.unregister())}catch(e){}}
      toast('초기화했어요. 새로 시작해요');await sleep(900);location.replace(base);
    })};
}

/* ---------- 라우터 ---------- */
function route(){
  const q=new URLSearchParams(location.search);
  [...P.keys()].forEach(k=>P.delete(k));q.forEach((v,k)=>P.append(k,v));
  clearInterval(S.bt);S.keyOff&&S.keyOff();clearTimeout(S.auto);
  if(P.has('admin'))viewAdmin();
  else if(P.has('board'))viewBoard();
  else if(P.has('guide'))viewGuide();
  else if(P.has('update'))viewUpdate(P.get('update'));
  else if(P.has('repair'))viewRepair();
  else if(P.has('reset'))viewReset();
  else viewWelcome();
  renderTop();window.scrollTo(0,0);
}

/* ---------- 서비스 워커 등록 + 자동 업데이트 ---------- */
let reloading=false;
function initSW(){
  if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.register('sw.js?b='+encodeURIComponent(BUILD),{scope:'./'}).catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{
    if(e.data&&e.data.type==='updated'&&!reloading){
      const idle=!P.has('admin')&&!S.running&&!S.res.length&&!S.rec;
      if(idle){reloading=true;location.reload()}
      else toast('새 버전이 있어요','지금 업데이트',()=>{reloading=true;location.reload()},20000);
    }
  });
}
async function bgCheck(){
  if(!navigator.onLine)return;
  const r=await Updater.settings(false);if(r.changed&&!S.running&&!S.res.length&&!P.has('admin')){route();toast('설정이 업데이트됐어요')}
  const v=await Updater.remote();
  if(v&&v.build&&BUILD&&BUILD!=='dev'&&v.build!==BUILD)toast('새 앱 버전이 있어요','업데이트',()=>Updater.app(false));
}

/* ---------- 시작 ---------- */
Auth.load();
route();initSW();
window.addEventListener('load',()=>{Q.flush();setTimeout(bgCheck,1500);setInterval(bgCheck,10*60*1000);setInterval(()=>Q.flush(),30000)});
</script>
