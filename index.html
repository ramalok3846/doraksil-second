<script>
'use strict';
/* =====================================================================
   도락실 · 초 맞추기  (도서부 오락실)
   폴란드 퀴즈와 같은 원리: 폴더 하나 + 상대경로 + 단일 앱 + 주소 파라미터(?admin 등)
   · 로컬 우선: 기록은 먼저 이 기기에 저장 → 인터넷이 되면 Firebase REST 로 전송(대기열, PUT 만 사용)
   · 오프라인: 서비스 워커가 앱 전체를 저장
   · 관리자: Firebase 이메일 로그인(REST) + admins/{uid}=true
   · 원격 라이브: 기기가 2초마다 상태를 올리고(live), 관리자가 명령(cmd)을 내리면 기기가 실행
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={
  get(k,d){try{const v=localStorage.getItem('dr_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('dr_'+k,JSON.stringify(v));return true}catch(e){return false}},
  del(k){try{localStorage.removeItem('dr_'+k)}catch(e){}}
};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BUILD=(document.querySelector('meta[name="pq-build"]')||{}).content||'';
const VER=(document.querySelector('meta[name="pq-ver"]')||{}).content||'';
const BDATE=(document.querySelector('meta[name="pq-date"]')||{}).content||'';

/* ---------- 기본 설정 ---------- */
const DEF={
  ev:{title:'도락실',sub:'도서부 오락실 · 초 맞추기',date:'2026년 11월 11일 (수)',place:'충무공초등학교 꿈마루 도서관',
      welcome:'도서부 오락실 "도락실"에 오신 것을 환영해요!\n책 청구기호를 보고, 스톱워치를 목표 시간에 가장 가깝게 멈춰 보세요.\n예) 청구기호 201 → 2.01초'},
  site:{title:'도락실',short:'도락실',emoji:'🕹',color:'#b9a4f0',favicon:'',logo:''},
  books:[
    {id:'b1',title:'도서부 추천도서 1',author:'',call:'201',cover:'',on:true},
    {id:'b2',title:'도서부 추천도서 2',author:'',call:'305',cover:'',on:true}
  ],
  fields:{name:'req',grade:'req',klass:'req',num:'opt',sign:'opt'},
  opts:{hideAfter:0,boardName:'masked',showBoardOnResult:true,autoReset:0,
        mode:'all',pickCount:1,retries:0,retryRule:'best',warnInfo:true,warnStart:true,live:true},
  ts:0
};
const FB={url:'https://pal-inte-db-default-rtdb.asia-southeast1.firebasedatabase.app',apiKey:'AIzaSyCEmf0KIiaF11nmS2CfBNA5yxZA9nrtmUU',root:'dr'};
const SECTIONS=['ev','site','fields','opts'];
const clone=o=>JSON.parse(JSON.stringify(o));
function mergeCfg(s){
  const c=clone(DEF);
  if(s){for(const k of SECTIONS)Object.assign(c[k],s[k]||{});if(Array.isArray(s.books)&&s.books.length)c.books=s.books;c.ts=s.ts||0}
  return c;
}
let CFG=mergeCfg(store.get('cfg',null));
function saveCfgLocal(c){CFG=c;store.set('cfg',c);applySite()}
const activeBooks=()=>{const a=CFG.books.filter(b=>b.on!==false);return a.length?a:CFG.books};
const modeText=()=>{
  const O=CFG.opts,n=Math.max(1,+O.pickCount||1),a=activeBooks().length;
  const t=O.mode==='pick'&&a>n?a+'권 중 '+n+'권 선택':O.mode==='random'&&a>n?a+'권 중 '+n+'권 무작위':O.mode==='remote'?'진행자가 책을 정해요':a+'권 모두 도전';
  return t+((+O.retries)>0?' · 재도전 '+O.retries+'회':'');
};

/* ---------- 사이트 제목 · 테마 색 · 파비콘 ---------- */
function hex2hsl(h){
  h=String(h||'').replace('#','');if(h.length===3)h=h.replace(/./g,'$&$&');
  if(!/^[0-9a-f]{6}$/i.test(h))h='b9a4f0';
  const r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,d=mx-mn;let hh=0,s=0;
  if(d){s=d/(1-Math.abs(2*l-1));hh=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;hh=Math.round(hh*60);if(hh<0)hh+=360}
  return [hh,Math.round(s*100),Math.round(l*100)];
}
function applyTheme(color){
  const [h,s0,l0]=hex2hsl(color),s=Math.max(30,s0),l=Math.min(82,Math.max(40,l0));
  const R=document.documentElement.style,H=(a,b)=>'hsl('+h+','+Math.min(100,a)+'%,'+b+'%)';
  R.setProperty('--hue',h);R.setProperty('--p',H(s,l));R.setProperty('--p2',H(s,Math.max(22,l-16)));R.setProperty('--p3',H(s,Math.max(15,l-30)));
  R.setProperty('--bg',H(80,97));R.setProperty('--bg2',H(75,93));R.setProperty('--line',H(60,89));
  R.setProperty('--ink',H(45,19));R.setProperty('--mute',H(14,48));
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=H(s,l);
}
function applySite(){
  const S=CFG.site||DEF.site;applyTheme(S.color);
  document.title=(S.title||'도락실')+' · 초 맞추기';
  for(const l of document.querySelectorAll('link[rel="icon"],link[rel="apple-touch-icon"]')){l.href=S.favicon||(l.rel==='icon'?'icon.svg':'icon-192.png');if(l.rel==='icon')l.type=S.favicon?'image/png':'image/svg+xml'}
  try{
    const custom=S.title!==DEF.site.title||S.short!==DEF.site.short||S.color!==DEF.site.color||S.favicon;
    const lk=document.querySelector('link[rel="manifest"]');if(!lk)return;
    if(!lk.dataset.orig)lk.dataset.orig=lk.getAttribute('href');
    if(!custom){lk.href=lk.dataset.orig;return}
    const abs=new URL('./',location.href).href,c=getComputedStyle(document.documentElement);
    const mf={name:(S.title||'도락실')+' · 초 맞추기',short_name:S.short||S.title||'도락실',id:abs,start_url:abs,scope:abs,display:'standalone',lang:'ko',
      background_color:c.getPropertyValue('--bg').trim()||'#f6f2ff',theme_color:c.getPropertyValue('--p').trim()||'#b9a4f0',
      icons:S.favicon?[{src:S.favicon,sizes:'128x128',type:'image/png',purpose:'any'}]:[{src:abs+'icon-192.png',sizes:'192x192',type:'image/png'},{src:abs+'icon-512.png',sizes:'512x512',type:'image/png'}]};
    lk.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));
  }catch(e){}
}

/* ---------- 계산 ---------- */
/* 청구기호의 첫 숫자 덩어리 ÷ 100 = 목표(초).  201 → 2.01초,  813 → 8.13초 */
const targetMs=b=>{const m=/\d+/.exec(String((b&&b.call)||''));return m?parseInt(m[0],10)*10:0};
const pad=(n,l)=>String(n).padStart(l,'0');
const fmt=ms=>{ms=Math.max(0,Math.round(ms));return pad(Math.floor(ms/60000),2)+':'+pad(Math.floor(ms/1000)%60,2)+'.'+pad(ms%1000,3)};
const sec=ms=>(ms/1000).toFixed(3)+'초';
const noStr=n=>'D-'+pad(n,3);
const maskName=n=>{n=String(n||'').trim();if(n.length<=1)return n;if(n.length===2)return n[0]+'*';return n[0]+'*'.repeat(n.length-2)+n[n.length-1]};
/* 순위 기준 = 책당 평균 차이 (책 수가 달라도 공정). 같으면 첫 책 차이 → 먼저 참여한 순 */
const avgOf=x=>(x.total!=null?x.total:x.t)/Math.max(1,x.res?x.res.length:(x.c||CFG.books.length));
const rankSort=(a,b)=>avgOf(a)-avgOf(b)||(a.first!=null?a.first:a.f||0)-(b.first!=null?b.first:b.f||0)||a.ts-b.ts;
const chosen=tries=>CFG.opts.retryRule==='last'?tries[tries.length-1]:tries.reduce((m,t)=>t.diff<m.diff?t:m,tries[0]);

/* ---------- 네트워크 / 클라우드(REST) ---------- */
const net={state:'idle'};
async function fetchT(url,opt,ms){
  const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||8000);
  try{return await fetch(url,Object.assign({},opt,{signal:c.signal}))}finally{clearTimeout(t)}
}
const Auth={
  id:null,
  load(){let v=null;try{v=sessionStorage.getItem('dr_adm')||localStorage.getItem('dr_adm')}catch(e){}try{Auth.id=v?JSON.parse(v):null}catch(e){Auth.id=null}},
  keep(){try{return localStorage.getItem('dr_keep')==='1'}catch(e){return false}},
  save(){const t=JSON.stringify(Auth.id),k=Auth.keep();try{sessionStorage.removeItem('dr_adm');localStorage.removeItem('dr_adm')}catch(e){}try{(k?localStorage:sessionStorage).setItem('dr_adm',t)}catch(e){}},
  clear(){Auth.id=null;try{sessionStorage.removeItem('dr_adm');localStorage.removeItem('dr_adm')}catch(e){}},
  async post(url,body,form){
    let r;
    try{r=await fetchT(url,{method:'POST',headers:{'Content-Type':form?'application/x-www-form-urlencoded':'application/json'},body:form?new URLSearchParams(body).toString():JSON.stringify(body)},9000)}
    catch(e){const x=new Error('network');x.kind='net';throw x}
    const j=await r.json().catch(()=>({}));
    if(!r.ok){const x=new Error((j.error&&j.error.message)||('HTTP '+r.status));x.kind=r.status>=500?'net':'auth';throw x}
    return j;
  },
  async signIn(email,pw){
    const j=await Auth.post('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(FB.apiKey),{email,password:pw,returnSecureToken:true});
    Auth.id={idToken:j.idToken,refresh:j.refreshToken,exp:Date.now()+(+j.expiresIn||3600)*1000,uid:j.localId,email:j.email||email,admin:null};
    Auth.save();return Auth.id;
  },
  async refresh(){
    const a=Auth.id;
    const j=await Auth.post('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(FB.apiKey),{grant_type:'refresh_token',refresh_token:a.refresh},true);
    Auth.id=Object.assign({},a,{idToken:j.id_token,refresh:j.refresh_token,exp:Date.now()+(+j.expires_in||3600)*1000,uid:j.user_id});
    Auth.save();return Auth.id;
  },
  async token(){
    const a=Auth.id;if(!a)return null;
    if(a.exp-Date.now()>60000)return a.idToken;
    try{return (await Auth.refresh()).idToken}catch(e){return null}
  }
};
const Cloud={
  async req(path,method,body,adm,ms){
    let q='';
    if(adm){const t=await Auth.token();if(!t){const x=new Error('noauth');x.kind='auth';throw x}q='?auth='+encodeURIComponent(t)}
    let r;
    try{r=await fetchT(FB.url+'/'+(path[0]==='/'?path.slice(1):FB.root+'/'+path)+'.json'+q,{method,headers:body!==undefined?{'Content-Type':'application/json'}:undefined,body:body!==undefined?JSON.stringify(body):undefined},ms||8000)}
    catch(e){const x=new Error('network');x.kind='net';throw x}
    if(r.status===401||r.status===403){const x=new Error('denied');x.kind='auth';throw x}
    if(!r.ok){const x=new Error('HTTP '+r.status);x.kind=r.status>=500?'net':'bad';throw x}
    return r.json().catch(()=>null);
  },
  get:(p,adm,ms)=>Cloud.req(p,'GET',undefined,adm,ms),
  put:(p,b,adm,ms)=>Cloud.req(p,'PUT',b,adm,ms),
  del:(p,adm)=>Cloud.req(p,'DELETE',undefined,adm)
};
/* 오프라인 대기열: 같은 요청을 여러 번 보내도 안전하도록 PUT/DELETE 만 사용 */
const Q={
  list(){return store.get('q',[])},
  push(job){job.id=uid();const l=Q.list();l.push(job);store.set('q',l);Q.flush()},
  busy:false,
  async flush(){
    if(Q.busy||!navigator.onLine)return;Q.busy=true;setNet('syn');
    const done=new Set();
    try{
      for(const j of Q.list()){
        try{if(j.m==='DELETE')await Cloud.del(j.p,!!j.adm);else await Cloud.put(j.p,j.b,!!j.adm);done.add(j.id)}
        catch(e){if(e.kind==='bad'){done.add(j.id);continue}if(e.kind==='net')break}
      }
    }catch(e){}
    store.set('q',Q.list().filter(j=>!done.has(j.id)));
    Q.busy=false;setNet(Q.list().length?'wait':'ok');
  }
};
function setNet(s){net.state=s;renderTop()}

/* ---------- 기록 ---------- */
const devId=()=>{let d=store.get('dev',null);if(!d){d=uid();store.set('dev',d)}return d};
const Recs={
  local(){return store.get('recs',[])},
  addLocal(r){const l=Recs.local();l.push(r);store.set('recs',l)},
  delLocal(id){store.set('recs',Recs.local().filter(r=>r.id!==id))},
  /* 참여 번호: 클라우드 카운터(오르기만 가능) → 실패 시 이 기기 번호 */
  async nextNo(){
    const base=store.get('cnt',0);
    for(let k=0;k<3;k++){
      try{
        const c=await Cloud.get('cnt',false,2500);const cur=Math.max(base,+c||0);
        await Cloud.put('cnt',cur+1,false);store.set('cnt',cur+1);return {n:cur+1,off:0};
      }catch(e){if(e.kind==='net')break}
    }
    const n=base+1;store.set('cnt',n);return {n,off:1};
  },
  dispName(p){return CFG.opts.boardName==='none'?'':(CFG.opts.boardName==='full'?p.name:maskName(p.name))},
  grp(p){return [p.grade&&p.grade+'학년',p.klass&&p.klass+'반'].filter(Boolean).join(' ')},
  async submit(p,res,sel){
    const total=res.reduce((a,x)=>a+x.diff,0);
    const rec={id:uid(),ts:Date.now(),p,res,sel,mode:CFG.opts.mode,total,first:res[0]?res[0].diff:0,dev:devId()};
    const {n,off}=await Recs.nextNo();rec.n=n;rec.off=off;
    Recs.addLocal(rec);
    Q.push({m:'PUT',p:'records/'+rec.id,b:{json:JSON.stringify(rec),ts:rec.ts}});
    Q.push({m:'PUT',p:'board/'+rec.id,b:{n:rec.n,nm:Recs.dispName(p)||'',g:Recs.grp(p),t:rec.total,c:res.length,f:rec.first,ts:rec.ts}});
    return rec;
  },
  async all(){
    const map=new Map();Recs.local().forEach(r=>map.set(r.id,r));let cloudOk=false;
    try{
      const o=await Cloud.get('records',true,10000)||{};cloudOk=true;
      for(const [id,v] of Object.entries(o)){try{const r=JSON.parse(v.json);r.id=r.id||id;map.set(r.id,r)}catch(e){}}
    }catch(e){}
    const l=[...map.values()];l.sort(rankSort);
    return {list:l,cloudOk};
  },
  async board(){
    const map=new Map();
    Recs.local().forEach(r=>map.set(r.id,{id:r.id,n:r.n,nm:Recs.dispName(r.p),g:Recs.grp(r.p),t:r.total,c:r.res.length,f:r.first,ts:r.ts}));
    let ok=false;
    try{const o=await Cloud.get('board',false,6000)||{};ok=true;for(const [id,v] of Object.entries(o))map.set(id,Object.assign({id},v));store.set('boardCache',Object.entries(o).map(([id,v])=>Object.assign({id},v)))}
    catch(e){store.get('boardCache',[]).forEach(v=>{if(!map.has(v.id))map.set(v.id,v)})}
    const l=[...map.values()];l.sort(rankSort);return {list:l,ok};
  }
};

function Sig(cv){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=cv.clientWidth||300,h=150;cv.width=w*dpr;cv.height=h*dpr;
  const c=cv.getContext('2d');c.scale(dpr,dpr);c.lineWidth=3;c.lineCap='round';c.lineJoin='round';c.strokeStyle='#2a2050';
  let down=false,dirty=false;
  const pt=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{down=true;cv.setPointerCapture(e.pointerId);const [x,y]=pt(e);c.beginPath();c.moveTo(x,y);c.lineTo(x+.1,y+.1);c.stroke();dirty=true};
  cv.onpointermove=e=>{if(!down)return;const [x,y]=pt(e);c.lineTo(x,y);c.stroke()};
  cv.onpointerup=cv.onpointercancel=()=>{down=false};
  return {clear(){c.clearRect(0,0,w,h);dirty=false},
    data(){if(!dirty)return '';const t=document.createElement('canvas');t.width=300;t.height=100;const x=t.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,300,100);x.drawImage(cv,0,0,300,100);return t.toDataURL('image/jpeg',.6)}};
}

function viewPlay(){
  setView('play');
  const b=S.sel[S.i];const tg=targetMs(b);S.running=false;
  const O=CFG.opts,tries=S.tries[S.i]||[],allow=1+(+O.retries||0)+(S.bonus[S.i]||0);
  app().innerHTML='<div class="cab">'+steps()+
    '<div class="muted">'+(S.i+1)+' / '+S.sel.length+'번째 책'+(allow>1?' · 도전 '+(tries.length+1)+' / '+allow+'회':'')+'</div>'+
    '<div class="row" style="justify-content:center;align-items:flex-start;gap:18px;margin:14px 0"><div class="bk" style="width:116px"><div class="cv" style="width:116px;height:160px;'+(b.cover?'background-image:url('+esc(b.cover)+')':'')+'">'+(b.cover?'':'📖')+'</div></div>'+
    '<div style="text-align:left;flex:1;min-width:150px"><b style="font-size:19px;line-height:1.35">'+esc(b.title)+'</b><div class="muted">'+esc(b.author)+'</div><div class="tag">청구기호 '+esc(b.call)+'</div></div></div>'+
    '<div class="muted">목표 시간</div><div class="target">'+(tg/1000).toFixed(2)+'초</div>'+
    '<div class="screen"><div class="digits" id="dg">00:00.000</div></div>'+
    '<button class="btn big" id="main">▶ START</button><div class="muted" style="margin-top:10px" id="hint">START → 목표 시간에 STOP! (스페이스바도 돼요)</div></div>';
  const dg=$('#dg'),btn=$('#main');
  const hideAfter=(+O.hideAfter||0)*1000;
  const tick=()=>{const el=performance.now()-S.t0;dg.textContent=(hideAfter&&el>hideAfter)?'??:??.???':fmt(el);S.raf=requestAnimationFrame(tick)};
  const start=()=>{S.running=true;S.t0=performance.now();dg.classList.add('run');btn.textContent='■ STOP';btn.classList.add('red');$('#hint').textContent=hideAfter?hideAfter/1000+'초 뒤 숫자가 가려져요. 감으로 멈춰요!':'목표 시간에 맞춰 STOP!';tick();Live.kick()};
  const stop=()=>{
    const el=Math.round(performance.now()-S.t0);cancelAnimationFrame(S.raf);S.running=false;
    (S.tries[S.i]=S.tries[S.i]||[]).push({ms:el,diff:Math.abs(el-tg)});
    S.keyOff&&S.keyOff();
    if(S.pendLock!=null){setLock(S.pendLock);S.pendLock=null}
    viewBook();
  };
  const trigger=async()=>{
    if(S.asking||S.lock)return;
    if(S.running){stop();return}
    if(O.warnStart){
      const ok=await ask({title:'스톱워치를 시작할까요?',warn:'<b>시작하면 되돌릴 수 없어요.</b> STOP을 눌러야 기록이 남고, 도중에 화면을 나가면 이번 도전은 사라져요.',ok:'시작!',cancel:'잠깐만'});
      if(!ok)return;
    }
    start();
  };
  btn.onpointerdown=e=>{e.preventDefault();trigger()};
  const key=e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(e.repeat)return;trigger()}};
  document.addEventListener('keydown',key);S.keyOff=()=>{document.removeEventListener('keydown',key);S.keyOff=null};
}
function remaining(){return (+CFG.opts.retries||0)+(S.bonus[S.i]||0)-((S.tries[S.i]||[]).length-1)}

/* =====================================================================
   원격 라이브: 기기 → live/{id} (상태), 관리자 → cmd/{id} (명령)
   ※ 화면 영상을 그대로 공유하는 방식이 아니라, 화면 '상태'를 보내 관리자 쪽에 미니 화면으로 다시 그려요.
   ===================================================================== */
const Live={
  id:devId(),timer:0,poller:0,lastS:'',lastT:0,kt:0,
  name:store.get('devname',''),seen:store.get('cmdseen',''),
  code(){return this.id.slice(-4).toUpperCase()},
  label(){return this.name||('기기 '+this.code())},
  on(){return CFG.opts.live!==false&&navigator.onLine},
  snap(){
    const b=S.sel[S.i];
    return {v:S.view,nm:S.p.name?maskName(S.p.name):'',g:Recs.grp(S.p),bi:S.i,bn:S.sel.length,bt:b?b.title:'',tg:b?targetMs(b):0,
      run:S.running,t0:S.running?Math.round(Date.now()-(performance.now()-S.t0)):0,tr:(S.tries[S.i]||[]).length,
      rs:S.res.map(x=>x.diff),lk:S.lock?1:0,label:Live.label(),code:Live.code(),ver:BUILD.slice(0,8),ack:Live.seen,ts:Date.now()};
  },
  kick(){clearTimeout(Live.kt);Live.kt=setTimeout(()=>Live.push(true),250)},
  async push(force){
    if(!Live.on()||P.has('admin'))return;
    const s=Live.snap(),key=JSON.stringify(Object.assign({},s,{ts:0}));
    if(!force&&key===Live.lastS&&Date.now()-Live.lastT<8000)return;
    Live.lastS=key;Live.lastT=Date.now();
    try{await Cloud.put('live/'+Live.id,{st:JSON.stringify(s),ts:s.ts},false,4000)}catch(e){}
  },
  async poll(){
    if(!Live.on()||P.has('admin'))return;
    let c=null;try{c=await Cloud.get('cmd/'+Live.id,false,4000)}catch(e){return}
    if(!c||!c.id||c.id===Live.seen)return;
    Live.seen=c.id;store.set('cmdseen',c.id);
    if(Math.abs(Date.now()-(c.ts||0))>180000)return;
    runCmd(c);Live.kick();
  },
  start(){clearInterval(Live.timer);clearInterval(Live.poller);Live.timer=setInterval(()=>Live.push(false),2000);Live.poller=setInterval(()=>Live.poll(),2200);Live.push(true)}
};
function setLock(on){
  S.lock=!!on;const old=$('#lockov');if(old)old.remove();
  if(S.lock){const d=document.createElement('div');d.className='lockov';d.id='lockov';d.innerHTML='<div><div class="eyebrow" style="color:#fff">Paused</div><h1 style="margin:10px 0">잠시 멈췄어요</h1><p>진행자가 다시 시작해 줄 때까지 기다려 주세요.</p></div>';document.body.appendChild(d)}
}
function runCmd(c){
  switch(c.type){
    case 'setbooks':{
      const l=(c.ids||[]).map(id=>CFG.books.find(b=>b.id===id)).filter(Boolean);if(!l.length)return;
      if(S.view==='pick'||S.view==='wait'){S.sel=l;beginPlay();toast('진행자가 책을 정해 줬어요')}
      else{S.pending=l.map(b=>b.id);toast('다음 참가자의 책이 정해졌어요')}
      break}
    case 'retry':
      S.bonus[S.i]=(S.bonus[S.i]||0)+(+c.n||1);toast('진행자가 재도전 기회를 줬어요');
      if(S.view==='book')viewBook();else if(S.view==='play'&&!S.running)viewPlay();break;
    case 'home':if(S.running){cancelAnimationFrame(S.raf)}resetPlay();setLock(false);go('');toast('진행자가 처음 화면으로 돌렸어요');break;
    case 'lock':if(S.running)S.pendLock=!!c.on;else setLock(!!c.on);break;
    case 'msg':modal('<h3>📢 진행자 메시지</h3><p style="font-size:20px;font-weight:800;white-space:pre-wrap">'+esc(c.text||'')+'</p><button class="btn" id="c">확인</button>',(l,cl)=>{$('#c',l).onclick=cl});break;
    case 'rename':Live.name=String(c.name||'').slice(0,20);store.set('devname',Live.name);renderTop();break;
    case 'update':Updater.app(false);break;
  }
}

function collect(){

  if(AT==='books'){
    $$('.bcard').forEach(el=>{const b=DRAFT.books.find(x=>x.id===el.dataset.id);if(!b)return;
      b.title=$('.b_t',el).value.trim();b.author=$('.b_a',el).value.trim();b.call=$('.b_c',el).value.trim();b.on=$('.b_on',el).checked})
  }else if(AT==='fields'){
    for(const k of Object.keys(DRAFT.fields)){const r=$('input[name="fd_'+k+'"]:checked');if(r)DRAFT.fields[k]=r.value}

function shrink(file,max,type){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(type==='image/png'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.78))};
    im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u;
  });
}

/* =====================================================================
   업데이트 / 서비스 워커 / 복구
   ===================================================================== */
const Updater={
  async remote(){try{const r=await fetchT('version.json?_='+Date.now(),{cache:'no-store'},6000);return r.ok?await r.json():null}catch(e){return null}},
  async settings(force){
    if(!navigator.onLine)return {ok:false,msg:'오프라인이에요. 이 기기에 저장된 설정을 쓰고 있어요.'};
    try{
      const c=await Cloud.get('cfg',false,7000);
      if(!c||!Array.isArray(c.books))return {ok:true,msg:'클라우드에 저장된 설정이 아직 없어요.'};
      if(!force&&(c.ts||0)<=(CFG.ts||0))return {ok:true,msg:'이미 최신 설정이에요.'};
      const n=mergeCfg(c);n.ts=c.ts||Date.now();
      const changed=(c.ts||0)!==(CFG.ts||0);saveCfgLocal(n);DRAFT=null;
      return {ok:true,changed,msg:changed?'새 설정을 받았어요.':'이미 최신 설정이에요.'};
    }catch(e){return {ok:false,msg:e.kind==='net'?'네트워크 오류로 설정을 못 받았어요.':'설정을 받을 수 없어요. (규칙 게시 확인)'}}
  },
  async app(hard,out){
    const say=t=>{if(out)out.textContent=t};
    if(!navigator.onLine){say('오프라인이에요. 인터넷에 연결한 뒤 다시 눌러 주세요.');return 'off'}
    say('서버 확인 중…');const v=await Updater.remote();
    if(!v){say('서버에 연결할 수 없어요.');return 'fail'}
    const newer=v.build&&v.build!==BUILD;
    if(!newer&&!hard){say('이미 최신 버전이에요. ('+VER+')');return 'same'}
    say(hard?'캐시를 지우고 새로 받는 중…':'새 버전을 받는 중…');
    try{
      if(hard){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}
      else{const r=await navigator.serviceWorker.getRegistration();if(r)await r.update()}
    }catch(e){}
    say('완료! 새로 시작해요…');await sleep(500);location.replace(base+'?_u='+Date.now().toString(36));return 'done';
  },
  async diag(){
    const out=[];out.push('온라인: '+(navigator.onLine?'예':'아니오'));
    out.push('서비스 워커: '+('serviceWorker' in navigator?((await navigator.serviceWorker.getRegistration())?'등록됨':'등록 안 됨'):'지원 안 함'));
    try{const ks=await caches.keys();for(const k of ks){const c=await caches.open(k);const rep=await c.match('__report.json');const n=(await c.keys()).length;let t='';if(rep){const j=await rep.json();t=' · 성공 '+j.ok.length+' / 실패 '+j.fail.length+(j.fail.length?' ('+j.fail.map(f=>esc(f[0])).join(', ')+')':'')}out.push('캐시 '+esc(k)+': '+n+'개'+t)}if(!ks.length)out.push('캐시: 없음 (한 번 온라인으로 열어야 해요)')}catch(e){out.push('캐시 확인 실패')}
    try{const e=await navigator.storage.estimate();out.push('저장소: '+(e.usage/1048576).toFixed(1)+'MB / '+(e.quota/1048576|0)+'MB')}catch(e){}
    out.push('이 기기 기록: '+Recs.local().length+'건 · 전송 대기 '+Q.list().length+'건 · 기기 코드 '+Live.code());
    return out.join('<br>');
  }
};

  const items=[['recs','이 기기의 참여 기록 (클라우드는 그대로)'],['cfg','이 기기의 설정 (책·화면 옵션)'],['q','전송 대기 목록'],['auth','관리자 로그인 정보'],['cache','앱 캐시 (오프라인 저장본)']];
  const pre=(P.get('reset')||'');const sel=pre==='all'?items.map(i=>i[0]):pre.split(',').map(n=>items[(+n)-1]&&items[(+n)-1][0]).filter(Boolean);
  app().innerHTML='<div class="card"><h2>초기화</h2><p class="muted">지울 항목을 고르세요. 클라우드 데이터는 지워지지 않아요.</p>'+items.map((it,i)=>'<label class="f"><input type="checkbox" value="'+it[0]+'"'+(sel.includes(it[0])?' checked':'')+'> '+(i+1)+'. '+esc(it[1])+'</label>').join('')+
    '<div class="row"><button class="btn red" id="go">선택 항목 초기화</button><button class="btn ghost" id="h">취소</button></div></div>';
  $('#h').onclick=()=>go('');
  $('#go').onclick=()=>{const c=$$('input:checked').map(x=>x.value);if(!c.length){toast('항목을 골라 주세요');return}
    confirmBox('선택한 항목을 지워요. 되돌릴 수 없어요.\n'+c.join(', '),'초기화',async()=>{
      if(c.includes('recs')){store.del('recs');store.del('cnt');store.del('boardCache')}
      if(c.includes('cfg'))store.del('cfg');if(c.includes('q'))store.del('q');
      if(c.includes('auth'))Auth.clear();
      if(c.includes('cache')){try{(await caches.keys()).forEach(k=>caches.delete(k));(await navigator.serviceWorker.getRegistrations()).forEach(r=>r.unregister())}catch(e){}}
      toast('초기화했어요. 새로 시작해요');await sleep(900);location.replace(base);
    })};
}

/* ---------- 라우터 ---------- */
function route(){
  const q=new URLSearchParams(location.search);
  [...P.keys()].forEach(k=>P.delete(k));q.forEach((v,k)=>P.append(k,v));
  if(!P.has('admin'))DRAFT=null;
  applySite();
  clearInterval(S.bt);clearInterval(S.lt);clearInterval(S.lt2);S.keyOff&&S.keyOff();clearTimeout(S.auto);
  if(P.has('admin'))viewAdmin();
  else if(P.has('board'))viewBoard();
  else if(P.has('guide'))viewGuide();
  else if(P.has('update'))viewUpdate(P.get('update'));
  else if(P.has('repair'))viewRepair();
  else if(P.has('reset'))viewReset();
  else viewWelcome();
  renderTop();window.scrollTo(0,0);
}

/* ---------- 서비스 워커 등록 + 자동 업데이트 ---------- */
let reloading=false;
function initSW(){
  if(!('serviceWorker' in navigator))return;
  navigator.serviceWorker.register('sw.js?b='+encodeURIComponent(BUILD),{scope:'./'}).catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{
    if(e.data&&e.data.type==='updated'&&!reloading){
      const idle=!P.has('admin')&&!S.running&&!S.res.length&&!S.rec&&['welcome','board','guide'].includes(S.view);
      if(idle){reloading=true;location.reload()}
      else toast('새 버전이 있어요','지금 업데이트',()=>{reloading=true;location.reload()},20000);
    }
  });
}
async function bgCheck(){
  if(!navigator.onLine)return;
  const r=await Updater.settings(false);if(r.changed&&S.view==='welcome'&&!P.has('admin')){route();toast('설정이 업데이트됐어요')}
  const v=await Updater.remote();
  if(v&&v.build&&BUILD&&BUILD!=='dev'&&v.build!==BUILD)toast('새 앱 버전이 있어요','업데이트',()=>Updater.app(false));
}

/* ---------- 시작 ---------- */
Auth.load();
route();initSW();
window.addEventListener('load',()=>{Q.flush();Live.start();setTimeout(bgCheck,1500);setInterval(bgCheck,10*60*1000);setInterval(()=>Q.flush(),30000)});
</script>
